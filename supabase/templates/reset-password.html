<!-- Supabase: Authentication > Email Templates > Reset Password
     Subject: Reset your Shoppa password -->
<div style="font-family: Figtree, -apple-system, Segoe UI, Roboto, sans-serif; color: #1c1c1e; max-width: 480px; margin: 0 auto; padding: 24px;">
  <h1 style="font-size: 22px; margin: 0 0 12px;">Reset your password</h1>
  <p style="font-size: 15px; line-height: 22px; color: #3a3a3e; margin: 0 0 20px;">
    Tap the button to choose a new password. The link expires in 30 minutes and works once.
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
       style="display: inline-block; background: #158544; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 16px; padding: 14px 24px; border-radius: 16px;">
      Set a new password
    </a>
  </p>
  <p style="font-size: 13px; line-height: 18px; color: #6b6b70; margin: 0;">
    If you didn't ask to reset your password, you can ignore this email. Your password won't change.
  </p>
</div>
