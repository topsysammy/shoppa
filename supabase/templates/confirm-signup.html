<!-- Supabase: Authentication > Email Templates > Confirm signup
     Subject: Your Shoppa code is {{ .Token }} -->
<div style="font-family: Figtree, -apple-system, Segoe UI, Roboto, sans-serif; color: #1c1c1e; max-width: 480px; margin: 0 auto; padding: 24px;">
  <h1 style="font-size: 22px; margin: 0 0 12px;">Verify your email</h1>
  <p style="font-size: 15px; line-height: 22px; color: #3a3a3e; margin: 0 0 20px;">
    Enter this code in Shoppa to finish creating your account:
  </p>
  <p style="font-size: 32px; font-weight: 700; letter-spacing: 8px; margin: 0 0 24px;">{{ .Token }}</p>
  <p style="font-size: 15px; line-height: 22px; color: #3a3a3e; margin: 0 0 16px;">Or tap the button to verify and open Shoppa:</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
       style="display: inline-block; background: #158544; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 16px; padding: 14px 24px; border-radius: 16px;">
      Verify email
    </a>
  </p>
  <p style="font-size: 13px; line-height: 18px; color: #6b6b70; margin: 0;">
    If you didn't sign up for Shoppa, you can ignore this email.
  </p>
</div>
