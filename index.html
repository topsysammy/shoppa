<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shoppa</title>
    <meta name="description" content="Write a list fast, share it on WhatsApp and shop from it offline." />
    <meta name="theme-color" content="#168A47" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shoppa" />
    <link rel="preload" href="/fonts/figtree-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply saved theme before first paint to avoid a flash (light, dark or system).
      try {
        var t = localStorage.getItem('shoppa.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Shoppa needs JavaScript. Please use Chrome, Safari, Edge, Firefox or Samsung Internet.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
